spring.application.name=insurance-forms-platform
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/formsdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.docs.directory=./generated-documents
app.libreoffice.command=libreoffice
app.security.user=operator
app.security.password=local-demo-password
logging.level.com.example.forms=INFO
